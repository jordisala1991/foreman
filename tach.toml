# Architecture of fm (see DESIGN.md, "Architecture"), enforced by `make check` (tach check). Run through `uv run tach`.
# `layers` goes from the outside in; a module may import its own layer and the ones below it, never above. A module with a
# `depends_on` is held to that list instead: an adapter cannot reach another adapter.
# Loosening a rule here is the owner's call.
exact = false  # layers carry most rules; an unused depends_on is not an error
forbid_circular_dependencies = true
source_roots = ["plugins/foreman"]
root_module = "ignore"
exclude = ["tests", "panel/**", "demo", ".venv", "**/__pycache__"]
layers = ["ui", "loop", "steps", "services", "registry", "adapters", "ports", "proc", "core"]

# ui: the owner's and the agents' entry points; they call the loop and everything below. cli and panel are two modules: the
# panel imports the CLI's functions, the CLI never imports the panel (`foreman/ui/main.py`, above both, starts `fm panel`).
[[modules]]
path = "foreman.ui.cli"
layer = "ui"

[[modules]]
path = "foreman.ui.panel"
layer = "ui"

[[modules]]
path = "foreman.ui.main"
layer = "ui"

# loop: the process that ticks; does the I/O and calls the core.
[[modules]]
path = "foreman.loop"
layer = "loop"

# steps: one step of a tick, or a view over several pieces.
[[modules]]
path = "foreman.steps"
layer = "steps"

# services: git and the lock: the outside world, called by the steps.
[[modules]]
path = "foreman.services.agents"
layer = "services"
[[modules]]
path = "foreman.services.delivery"
layer = "services"
[[modules]]
path = "foreman.services.lock"
layer = "services"
[[modules]]
path = "foreman.services.launchd"
layer = "services"
[[modules]]
path = "foreman.services.runsource"
layer = "services"
[[modules]]
path = "foreman.services.scratch"
layer = "services"

# registry: the one place that knows the provider adapters.
[[modules]]
path = "foreman.providers.registry"
layer = "registry"

# ports: the provider interface, the repo interface (every git operation on a repo), the runner interface (every agent session)
# and the backlog interface (every read and write of the backlog).
[[modules]]
path = "foreman.providers"
layer = "ports"
[[modules]]
path = "foreman.providers.repo"
layer = "ports"
[[modules]]
path = "foreman.providers.runner"
layer = "ports"
[[modules]]
path = "foreman.providers.backlog"
layer = "ports"

# adapters: one per platform. Layer "adapters" keeps the core from importing them; a layer rule keeps them from the loop, and their `depends_on` from each other.
[[modules]]
path = "foreman.providers.github"
layer = "adapters"
depends_on = ["foreman.providers"]
[[modules]]
path = "foreman.providers.local"
layer = "adapters"
depends_on = ["foreman.providers"]
# gitrepo: the one module that runs git on a repo, behind foreman.providers.repo.
[[modules]]
path = "foreman.providers.gitrepo"
layer = "adapters"
depends_on = ["foreman.providers.repo"]
# backlogfile: the backlog port's local adapter; the one module that names backlog.json.
[[modules]]
path = "foreman.providers.backlogfile"
layer = "adapters"
depends_on = ["foreman.providers.backlog"]

# claude: the runner port's adapter; the one place that builds a claude command line.
[[modules]]
path = "foreman.providers.claude"
layer = "adapters"
depends_on = ["foreman.providers.runner"]

# orca: the runner port's second adapter; agents as Orca chats, through the orca command line.
[[modules]]
path = "foreman.providers.orca"
layer = "adapters"
depends_on = ["foreman.providers.runner"]

# proc: the one module that runs programs; used by the loop, the services and the adapters, never by the core.
[[modules]]
path = "foreman.proc"
layer = "proc"

# core: vocabulary and pure rules (risk, autonomy, guard), plus the plain files that do not vary (config).
# Packages under foreman/core/ (a package path gives all its files); no subprocess here (ruff, TID251 in pyproject.toml).
[[modules]]
path = "foreman.core.project"
layer = "core"
depends_on = ["foreman.util"]
[[modules]]
path = "foreman.core.tasks"
layer = "core"
depends_on = ["foreman.core.project", "foreman.util"]
[[modules]]
path = "foreman.core.review"
layer = "core"
depends_on = ["foreman.util"]
[[modules]]
path = "foreman.core.rules.risk"
layer = "core"
depends_on = ["foreman.core.project"]
# decide: the loop's review and merge decisions; runs no program and touches no file, so it may import only risk.
[[modules]]
path = "foreman.core.rules.decide"
layer = "core"
depends_on = ["foreman.core.rules.risk"]
[[modules]]
path = "foreman.core.oversight"
layer = "core"
depends_on = ["foreman.core.project", "foreman.core.tasks", "foreman.core.review", "foreman.util"]
[[modules]]
path = "foreman.util"
layer = "core"
# launcher: which fm version runs; stdlib only, as the launchd jobs run it alone (python3 -c).
[[modules]]
path = "foreman.launcher"
layer = "core"
