# Architecture of fm (see DESIGN.md, "Architecture"), enforced by `make check` (tach check). Run through `uv run tach`.
# `layers` goes from the outside in; a module may import its own layer and the ones below it, never above. A module with a
# `depends_on` is held to that list instead: an adapter cannot reach another adapter.
# Loosening a rule here is the owner's call.
exact = false  # layers carry most rules; an unused depends_on is not an error
forbid_circular_dependencies = true
source_roots = ["."]
root_module = "ignore"
exclude = ["tests", "panel/**", "demo", ".venv", "**/__pycache__"]
layers = ["ui", "loop", "steps", "services", "registry", "adapters", "ports", "proc", "core"]

# ui: the owner's and the agents' entry points; they call the loop and everything below. One module: cli and panel import each other.
[[modules]]
path = "fm.ui"
layer = "ui"

# loop: the process that ticks; does the I/O and calls the core.
[[modules]]
path = "fm.loop"
layer = "loop"

# steps: one step of a tick, or a view over several pieces.
[[modules]]
path = "fm.steps"
layer = "steps"

# services: git, claude and the lock: the outside world, called by the steps.
[[modules]]
path = "fm.services.agents"
layer = "services"
[[modules]]
path = "fm.services.claude"
layer = "services"
[[modules]]
path = "fm.services.delivery"
layer = "services"
[[modules]]
path = "fm.services.lock"
layer = "services"
[[modules]]
path = "fm.services.launchd"
layer = "services"
[[modules]]
path = "fm.services.scratch"
layer = "services"

# registry: the one place that knows the provider adapters.
[[modules]]
path = "fm.providers.registry"
layer = "registry"

# ports: the provider interface.
[[modules]]
path = "fm.providers"
layer = "ports"

# adapters: one per platform. Layer "adapters" keeps the core from importing them; a layer rule keeps them from the loop, and their `depends_on` from each other.
[[modules]]
path = "fm.providers.github"
layer = "adapters"
depends_on = ["fm.providers"]
[[modules]]
path = "fm.providers.local"
layer = "adapters"
depends_on = ["fm.providers"]

# proc: the one module that runs programs; used by the loop, the services and the adapters, never by the core.
[[modules]]
path = "fm.proc"
layer = "proc"

# core: vocabulary and pure rules (risk, autonomy, guard), plus the plain files that do not vary (backlog.json, config).
# Packages under fm/core/ (a package path gives all its files); no subprocess here (ruff, TID251 in pyproject.toml).
[[modules]]
path = "fm.core.project"
layer = "core"
depends_on = ["fm.util"]
[[modules]]
path = "fm.core.tasks"
layer = "core"
depends_on = ["fm.core.project", "fm.util"]
[[modules]]
path = "fm.core.review"
layer = "core"
depends_on = ["fm.util"]
[[modules]]
path = "fm.core.rules.risk"
layer = "core"
depends_on = ["fm.core.project"]
# decide: the loop's review and merge decisions; runs no program and touches no file, so it may import only risk.
[[modules]]
path = "fm.core.rules.decide"
layer = "core"
depends_on = ["fm.core.rules.risk"]
[[modules]]
path = "fm.core.oversight"
layer = "core"
depends_on = ["fm.core.project", "fm.core.tasks", "fm.core.review", "fm.util"]
[[modules]]
path = "fm.util"
layer = "core"
# launcher: which fm version runs; stdlib only, as the launchd jobs run it alone (python3 -c).
[[modules]]
path = "fm.launcher"
layer = "core"
