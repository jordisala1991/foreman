# Development tools only: foreman itself is not a pip package (no [project] table) and needs nothing but the
# standard library at run time. `bin/foreman selftest` reads the pins below and runs the tools through uv
# (lib/foreman/quality.py); without uv, `pip install --group dev` (pip 25.1+) installs the same versions.

[dependency-groups]
dev = ["ruff==0.17.3", "pyright[nodejs]==1.1.414", "coverage==7.17.0"]

# Which quality checks the selftest runs (lib/foreman/quality.py): "ruff" (lint), "format" (ruff format --check),
# "pyright" (types, standard mode on lib/foreman and the developer tool, dev/foreman_dev).
[tool.foreman.quality]
checks = ["ruff", "format", "pyright"]

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["lib/foreman/_tomli", "ops"]
src = ["lib", "tests", "dev", "dev/tests"]

[tool.ruff.lint]
# The full rule set: syntax and name errors, import order, Python traps (B), over-broad except
# (BLE), subprocess.run without check= (PLW1510) and a few automatic rewrites. PLW0603: one deliberate `global`.
select = [
    "E4", "E7", "E9", "E501", "W", "F", "B", "I", "UP", "BLE", "C4", "PIE", "PLE", "PLW",
    "SIM101", "SIM102", "SIM103", "SIM105", "SIM110", "SIM114", "SIM118", "SIM201", "SIM401",
    "RUF006", "RUF012", "RUF013", "RUF015", "RUF021", "RUF059", "RUF100",
]
ignore = ["PLW0603"]
# Type annotations (ANN, without ANN401: `Any` is allowed where a value is any JSON or TOML) are required in every
# module of lib/foreman and dev/foreman_dev; tests/ and dev/tests/ are ruff-only, without them.
extend-select = ["ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ANN205", "ANN206"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"dev/tests/**" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["foreman", "foreman_dev"]
# the tests' own helpers come before foreman: helpers puts lib/ on sys.path
section-order = ["future", "standard-library", "third-party", "test-helpers", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
test-helpers = ["helpers", "golden", "stats_world", "timeline_world", "fake_gh", "devtool", "test_*"]

[tool.ruff.format]
docstring-code-format = false

[tool.pyright]
include = ["lib/foreman", "dev/foreman_dev", "dev/foreman-dev"]
extraPaths = ["lib", "dev"]
exclude = ["lib/foreman/_tomli"]
pythonVersion = "3.9"
typeCheckingMode = "standard"

[tool.coverage.run]
source = ["lib"]
omit = ["*/foreman/_tomli/*"]
parallel = true
patch = ["subprocess"]
