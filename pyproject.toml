[project]
name = "fm"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []  # fm has no runtime dependencies: the standard library only

[dependency-groups]
dev = [
    "ruff==0.17.4",
    "pyright==1.1.414",
    "pylint==4.1.3",
    "tach==0.35.3",
]

[tool.ruff]
line-length = 160
target-version = "py312"
extend-exclude = ["panel"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C90", "PLR0912", "PLR0913", "PLR0915", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations".msg = "not needed on Python 3.11+"
"subprocess".msg = "run programs through fm/proc.py: see DESIGN.md, Architecture"

# Only fm/proc.py runs processes. lock.py is the one exception (process groups and signals, see DESIGN.md), and the tests.
# Adding one here is the owner's call.
[tool.ruff.lint.per-file-ignores]
"fm/{proc,lock}.py" = ["TID251"]
"tests/*.py" = ["TID251"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pyright]
include = ["fm"]
typeCheckingMode = "strict"
enableTypeIgnoreComments = false  # a `type: ignore` comment does not silence anything
pythonVersion = "3.12"

# File length is the one thing ruff has no rule for: pylint, with only that check on. Tests get a larger limit (`make size`).
[tool.pylint.main]
disable = ["all"]
enable = ["too-many-lines"]

[tool.pylint.format]
max-module-lines = 300
