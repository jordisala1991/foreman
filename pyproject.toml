[project]
name = "fm"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []  # fm has no runtime dependencies: the standard library only

[dependency-groups]
dev = [
    "ruff==0.17.4",
    "pyright==1.1.414",
    "pylint==4.1.3",
]

[tool.ruff]
line-length = 160
target-version = "py312"
extend-exclude = ["panel"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C90", "PLR0912", "PLR0913", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pyright]
include = ["fm"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

# File length is the one thing ruff has no rule for: pylint, with only that check on. Tests get a larger limit (`make size`).
[tool.pylint.main]
disable = ["all"]
enable = ["too-many-lines"]

[tool.pylint.format]
max-module-lines = 300
