# An example product adapted to its needs without changing foreman (docs/extending.md): "quayside", an invented web
# service in one repo, ~/Projects/quayside, with its home inside it (ops/, this folder). Each layer of the guide:
#
# - values in this file: its own production agent type, a wording of its own, a notice kind it only wants to hear of;
# - its own commands at foreman's points: two loop checks (ops/checks/state-size.sh, ops/checks/worktrees.py), a CI
#   summary (ops/ci-summary.sh), a step in each new worktree, all reading what foreman gives them in FOREMAN_*
#   variables, or asking it (`"$FOREMAN_BIN" config --json`);
# - Claude Code's own pieces in the repo: a production agent type with its own name (.claude/agents/quayside-dev.md).
#
# The selftest loads this file strictly and runs its commands on a fake project (tests/test_config.py).

[project]
name = "quayside"
owner = "owner"
language = "en"
rules = "rules.md"
config_schema = 12

[paths]
worktrees = "~/Projects/quayside-wt"

[agents]
production_types = ["quayside-dev"]   # .claude/agents/quayside-dev.md in the repo; `dev` still counts too

[loop]
prompt = "quayside orchestrator loop"
lock_long_min = 120                    # its integration tests hold the database lock for long on purpose
checks = [                             # each runs in the home (this folder); `foreman check --run-checks` tries them
  "STATE_INFO_MB=500 STATE_ACT_MB=2000 checks/state-size.sh",
  "WORKTREES_INFO=4 WORKTREES_ACT=10 checks/worktrees.py",
]

[repos.web]
path = "~/Projects/quayside"
github = "example-org/quayside"
merge = "squash"
local_ci = "make check {ci}"
ci_runs = ["", "INTEGRATION=1"]
ci_summary = '"$FOREMAN_HOME/ci-summary.sh"'   # each run's output on stdin, one line back for the PR comment
# the variables need no quoting rules of their own; ${HOME} and awk '{print $1}' would reach bash as written
post_create = ['cp -c -R "$FOREMAN_MAIN/node_modules" "$FOREMAN_WT/" 2>/dev/null || true']
remote_checks = "required"

[resources.db]
guard = ["make check INTEGRATION=1", "docker compose up"]

[strings]
notes_heading = "# Quayside log {date}"

[deny]
patterns = ["make deploy", "git push .*--tags"]
message = "Never without the owner (rules.md)."
