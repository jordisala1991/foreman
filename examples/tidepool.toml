# An example product described for foreman: "tidepool", an invented mobile app (React Native) with its API (PHP in
# Docker), a landing page and transactional emails, each in its own repo. Home: ~/Projects/tidepool/ops, with the
# repos and the agents' worktrees beside it. It uses the machine's GPU (declared once in the registry:
# examples/machine/projects.toml) with only its own guard, and declares its own simulator and Docker resources.

[project]
name = "tidepool"
owner = "owner"
language = "en"
rules = "rules.md"

[paths]
notes = "notes"
reviews = "reviews"
worktrees = "~/Projects/tidepool/wt"

[backlog]
file = "backlog.json"

[ids]
project = "^[A-Z]{2}\\d*$"
issue = "^[A-Z]{2}-\\d+$"
criterion_required = []
report_prefixes = ["reviews/"]

[agents]
production_slots = 1
ready_target = 2
production_types = ["dev"]
production_worktree = "~/Projects/tidepool/wt/"

[loop]
prompt = "tidepool orchestrator loop"
every_min = 60
checks = []          # e.g. worktrees over 5 GB, booted simulators, Metro, Docker, open PRs without an agent

[repos.app]
path = "~/Projects/tidepool/tidepool-app"
github = "example-org/tidepool-app"
merge = "squash"
local_ci = "npm run lint && npm run typecheck && npm run test:ci"
remote_checks = "required"
require_approval = true              # the owner approves every PR
post_create = ["cp -c -R {main}/node_modules {wt}/", "cp {main}/.env {wt}/"]
risky_paths = [".github/workflows/", "eas.json", "app.config.ts", "fastlane/", "package.json:\"version\""]

[repos.api]
path = "~/Projects/tidepool/tidepool-api"
github = "example-org/tidepool-api"
merge = "merge"
local_ci = "make phpstan && make phpunit"
remote_checks = "required"
require_approval = true
risky_paths = ["migrations/", "deploy/", "config/packages/prod/", ".github/workflows/"]

[repos.landing]
path = "~/Projects/tidepool/tidepool-landing"
github = "example-org/tidepool-landing"
merge = "merge"
local_ci = "npm run build"
publish_on_merge = true              # the host deploys main

[repos.emails]
path = "~/Projects/tidepool/tidepool-emails"
github = "example-org/tidepool-emails"
merge = "merge"
require_approval = true

[resources.gpu]                      # the machine's GPU (registry [resources.gpu]: paths, busy): only the guard here
guard = ["xcodebuild", "expo run:ios", "npm run ios", "npm run e2e:ios"]

[resources.ios-sim]                  # simulator + Metro :8081 + the E2E runner: one at a time
guard = ["npm run ios", "npm run e2e:ios", "maestro test", "simctl boot", "expo start"]
busy = "lsof -nP -iTCP:8081 -sTCP:LISTEN 2>/dev/null | tail -n +2"
slots = ["<UDID of the agents' simulator>"]   # never the owner's own simulator

[resources.android-emu]
guard = ["npm run android", "npm run e2e:android", "emulator"]

[resources.api-docker]               # the API's containers (ports 8080/8025)
guard = ["make up", "make phpunit-postgis", "docker compose up"]

[deny]
patterns = ["make deploy", "ssh tidepool-prod", "git tag v", "git push .*(v[0-9]|--tags)",
            "gh workflow run (publish|release)", "(^|\\s)eas (build|update|submit)",
            "doctrine:migrations:migrate.*--env=prod", "fastlane (ios|android) (submit|promote|metadata)",
            "gh secret set", "app:send-", "gh pr merge"]
message = "Never without the owner (rules.md); PRs are merged with foreman integrate --approved."

[publish]
means = ["API deploy", "tag v* and the release workflow", "EAS build/update/submit",
         "merging into landing (the host deploys main)"]

[[recurring]]
name = "tidepool orchestrator loop"
every = "every 60 min"
sources = [{ heartbeat = "loop", max_h = 2 }]
